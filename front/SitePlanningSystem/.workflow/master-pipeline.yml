version: '1.0'
name: master-pipeline
displayName: MasterPipeline
triggers:
  trigger: auto
  push:
    branches:
      include:
        - master
stages:
  - name: compile
    displayName: 编译
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_nodejs
        displayName: Nodejs 构建
        nodeVersion: 16.14.2
        commands:
          - npm config set strict-ssl false
          - npm config set registry https://registry.npmmirror.com
          - npm install --prefer-offline --prefer-online
          - rm -rf ./dist && npm run build
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./dist
        caches:
          - ~/.npm
        strategy:
          retry: '5'
          timeout: 15
      - step: publish@general_artifacts
        name: publish_general_artifacts
        displayName: 上传制品
        dependArtifact: BUILD_ARTIFACT
        artifactName: output
        strategy: {}
        dependsOn: build_nodejs
  - name: release
    displayName: 发布
    strategy: naturally
    trigger: auto
    steps:
      - step: publish@release_artifacts
        name: publish_release_artifacts
        displayName: 发布
        dependArtifact: output
        version: 1.0.0.0
        autoIncrement: true
        strategy: {}
      - step: deploy@agent
        name: deploy_agent
        displayName: 主机部署
        hostGroupID:
          ID: nc-server-1
          hostID:
            - c2a116a5-0d19-4bcc-8929-62ca2ecebb61
        deployArtifact:
          - source: build
            name: output
            target: ~/gitee_nc/dashboard
            dependArtifact: BUILD_ARTIFACT
        script:
          - cd /nanchang/tools/shell
          - ''
          - ./dashboardDep.sh
          - echo 'Hello Gitee Go!'
        notify: []
        strategy:
          retry: '0'
