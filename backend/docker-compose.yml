version: '3.8'

services:
  postgis:
    image: postgis/postgis:17-master
    container_name: postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - /home/postgresql/data:/var/lib/postgresql/data
